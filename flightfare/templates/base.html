<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Estimate one-way flight prices across 96 airports and 57 airlines, and see when and how to fly cheaper.">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11110f" media="(prefers-color-scheme: dark)">
  <title>{% block title %}farecast · flight fare estimates{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header container">
    <a class="wordmark" href="{{ url_for('index') }}">farecast<span class="dot" aria-hidden="true">.</span></a>
    <nav><a href="{{ url_for('index') }}">New search</a></nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer container">
    <p>Fares are estimates from a machine-learning model trained on simulated prices for real routes and airlines. They are not live offers. Always check with the airline before booking.</p>
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
